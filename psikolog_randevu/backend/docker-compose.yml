services:
  postgres:
    image: postgres:16-alpine
    container_name: pdr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pdr_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pdr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-pdr_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pdr_postgres_data:
